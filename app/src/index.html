<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panggung</title><style>
:root{font-family:system-ui,sans-serif;color:#182328;background:#f5f7f6}body{margin:0}header{background:#132a28;color:white;padding:1rem 2rem;font-weight:700}main{max-width:950px;margin:2rem auto;padding:0 1rem}h1{margin-bottom:.3rem}p{color:#52645e}form,table{background:white;border:1px solid #d9e2de;border-radius:8px;width:100%;box-sizing:border-box}form{display:grid;gap:.7rem;padding:1rem;margin:1.5rem 0}label{display:grid;gap:.25rem;font-size:.9rem}input,textarea,button{font:inherit;padding:.6rem;border:1px solid #aebeb7;border-radius:4px}button{background:#176451;color:white;cursor:pointer;justify-self:start}table{border-collapse:collapse;text-align:left}th,td{padding:.8rem;border-bottom:1px solid #d9e2de;overflow-wrap:anywhere}th{font-size:.8rem;color:#52645e}#status{min-height:1.5rem}@media(max-width:500px){th,td{padding:.4rem}}
</style></head><body><header>Panggung / Developer portal</header><main><h1>Software catalog</h1><p>Discover and register local engineering components. Early development preview.</p>
<form id="form"><label>Name<input name="name" required pattern="[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?" maxlength="63" placeholder="payment-service"></label><label>Owner<input name="owner" required maxlength="100"></label><label>Description<textarea name="description" maxlength="2000"></textarea></label><button>Register component</button></form>
<p id="status" role="status" aria-live="polite"></p><table><thead><tr><th>Name</th><th>Owner</th><th>Description</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const form=document.querySelector('#form'), status=document.querySelector('#status'), rows=document.querySelector('#rows');
async function load(){const r=await fetch('/api/components');if(!r.ok)throw Error('Could not load catalog');const items=await r.json();rows.replaceChildren();for(const item of items){const tr=document.createElement('tr');for(const key of ['name','owner','description']){const td=document.createElement('td');td.textContent=item[key];tr.append(td)}rows.append(tr)}status.textContent=items.length?items.length+' components':'No components registered yet'}
form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/components',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(!r.ok)throw Error(await r.text());form.reset();await load()}catch(e){status.textContent=e.message}finally{button.disabled=false}});
load().catch(e=>status.textContent=e.message);
</script></body></html>
